services:
  db:
    # PostgreSQL 16 + pgvector extension (the AI engine will use pgvector later)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - video_data:/data/videos:ro
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      AI_ENGINE_URL: ${AI_ENGINE_URL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-150}
      VIDEO_ENGINE_URL: ${VIDEO_ENGINE_URL:-http://video-engine:9000}
      VIDEO_TIMEOUT_SECONDS: ${VIDEO_TIMEOUT_SECONDS:-300}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
    depends_on:
      db:
        condition: service_healthy

  # Internal service: only the backend talks to it, so the port is not
  # published to the host (use `expose`).
  ai-engine:
    build: ./ai-engine
    expose:
      - "8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-25}
      # /summarize reads a whole README; chat keeps the short global timeout above.
      SUMMARIZE_TIMEOUT_SECONDS: ${SUMMARIZE_TIMEOUT_SECONDS:-120}
      MIN_SIMILARITY: ${MIN_SIMILARITY:-0}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      ollama:
        condition: service_healthy
      db:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GPU by default: the target is a /chat answer under 30s, so Ollama must use
  # an NVIDIA GPU. On a machine without a GPU, use the CPU override:
  #   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up
  ollama:
    image: ollama/ollama:0.5.7
    container_name: devradar_ollama
    environment:
      OLLAMA_KEEP_ALIVE: -1
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Pulls the model once Ollama is healthy (first run can take a few minutes).
  ollama-pull:
    image: curlimages/curl:latest
    container_name: devradar_ollama_pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    command: >
      sh -c "
        set -e;
        echo 'Đang tải model '$$OLLAMA_MODEL' (sẽ mất vài phút tùy mạng)...';
        curl -f -sS -X POST http://ollama:11434/api/pull -d '{\"name\": \"'$$OLLAMA_MODEL'\", \"stream\": false}' | tee /tmp/pull.json;
        grep -q '\"status\":\"success\"' /tmp/pull.json;
        echo '';
        echo 'Đã tải xong!';
      "

  # Renders MP4s into video_data. The backend mounts the same volume read-only
  # and serves the files. No healthcheck/depends_on on purpose: if this image is
  # slow to build or crashes, it must not hold up the API - video_client already
  # maps a connection failure to 502.
  video-engine:
    build: ./video-engine
    expose:
      - "9000"
    volumes:
      - video_data:/data/videos
    environment:
      OUTPUT_DIR: /data/videos

volumes:
  db_data:
  ollama_data:
  video_data:
