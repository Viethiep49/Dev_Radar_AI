  #     DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
  #     AI_ENGINE_URL: http://ai-engine:8000
  #     JWT_SECRET: ${JWT_SECRET}
  #   depends_on:
  #     - db
  #     - ai-engine

  # Bỏ comment khi ai-engine/Dockerfile đã có
  # ai-engine:
