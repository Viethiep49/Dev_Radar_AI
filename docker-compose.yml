services:
  db:
    # PostgreSQL 16 + pgvector extension (the AI engine will use pgvector later)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AI_ENGINE_URL: ${AI_ENGINE_URL:-}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
    depends_on:
      db:
        condition: service_healthy

  # Bỏ comment khi ai-engine/Dockerfile đã có
  # (khi đó đặt AI_ENGINE_URL=http://ai-engine:8000 trong .env)
  # ai-engine:
  #   build: ./ai-engine
  #   environment:
  #     LLM_API_KEY: ${LLM_API_KEY}

volumes:
  db_data:
