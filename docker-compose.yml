services:
  db:
    # PostgreSQL 16 + pgvector extension (the AI engine will use pgvector later)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AI_ENGINE_URL: ${AI_ENGINE_URL:-}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
    depends_on:
      db:
        condition: service_healthy

  # Internal service: only the backend talks to it, so the port is not
  # published to the host (use `expose`).
  ai-engine:
    build: ./ai-engine
    expose:
      - "8000"
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-25}
      MIN_SIMILARITY: ${MIN_SIMILARITY:-0.35}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      ollama:
        condition: service_healthy
      db:
        condition: service_healthy

  # GPU by default: the target is a /chat answer under 30s, so Ollama must use
  # an NVIDIA GPU. On a machine without a GPU, use the CPU override:
  #   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up
  ollama:
    image: ollama/ollama:latest
    container_name: devradar_ollama
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Pulls the model once Ollama is healthy (first run can take a few minutes).
  ollama-pull:
    image: curlimages/curl:latest
    container_name: devradar_ollama_pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    command: >
      sh -c "
        echo 'Đang tải model '$$OLLAMA_MODEL' (sẽ mất vài phút tùy mạng)...';
        curl -sS -X POST http://ollama:11434/api/pull -d '{\"name\": \"'$$OLLAMA_MODEL'\"}';
        echo '\\nĐã tải xong!';
      "

volumes:
  db_data:
  ollama_data:
